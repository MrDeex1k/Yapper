name: yapper
x-local-logging: &local-logging
  driver: local
  options:
    max-size: 10m
    max-file: "3"
x-auth-environment: &auth-environment
  AUTH_DATABASE_URL: postgres://yapper_auth@postgres:5432/yapper_auth
  AUTH_DATABASE_PASSWORD: ${AUTH_DB_PASSWORD:?Required}
  AUTH_BASE_URL: https://${YAPPER_DOMAIN:?Required}
  AUTH_ISSUER: https://${YAPPER_DOMAIN:?Required}
  AUTH_SECRET: ${AUTH_SECRET:?Required}
  AUTH_INTERNAL_SECRET: ${AUTH_INTERNAL_SECRET:?Required}
  AUTH_HOST: 0.0.0.0
  AUTH_PORT: 3001
x-server-environment: &server-environment
  DATABASE_URL: postgres://yapper_app@postgres:5432/yapper_app
  DATABASE_PASSWORD: ${APP_DB_PASSWORD:?Required}
  HTTP_ADDR: 0.0.0.0:8080
  YAPPER_TRUST_INGRESS_IP: "true"
  AUTH_ISSUER: https://${YAPPER_DOMAIN:?Required}
  AUTH_JWKS_URL: http://auth:3001/api/auth/jwks
  AUTH_INTERNAL_URL: http://auth:3001
  AUTH_INTERNAL_SECRET: ${AUTH_INTERNAL_SECRET:?Required}
  YAPPER_GUEST_JOINS_PER_MINUTE: ${YAPPER_GUEST_JOINS_PER_MINUTE:-180}
  YAPPER_MESSAGES_PER_MINUTE: ${YAPPER_MESSAGES_PER_MINUTE:-120}
  SETUP_TOKEN: ${SETUP_TOKEN:?Required}
  SETUP_TOKEN_EXPIRES_AT: ${SETUP_TOKEN_EXPIRES_AT:?Required}
  LIVEKIT_INTERNAL_URL: http://livekit:7880
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Required}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Required}
services:
  postgres:
    logging: *local-logging
    image: postgres:19.0-alpine@sha256:8b0ff4cdf221f0c53d7fcda681d3b461be725c492cd881c5ec9c0ad25023f188
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Required}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Required}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/init-databases.sh:/docker-entrypoint-initdb.d/10-yapper.sh:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U postgres]
      interval: 3s
      timeout: 3s
      retries: 20
  auth-migrate:
    logging: *local-logging
    image: ${YAPPER_AUTH_IMAGE:-yapper-auth:0.1.0-dev}
    build: { context: ., target: auth }
    environment: *auth-environment
    command: [bun, src/migrate.ts]
    depends_on:
      postgres: { condition: service_healthy }
  auth:
    logging: *local-logging
    image: ${YAPPER_AUTH_IMAGE:-yapper-auth:0.1.0-dev}
    build: { context: ., target: auth }
    restart: unless-stopped
    environment: *auth-environment
    depends_on:
      auth-migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [CMD, bun, -e, "const r=await fetch('http://127.0.0.1:3001/readyz');process.exit(r.ok?0:1)"]
      interval: 5s
      timeout: 3s
      retries: 12
  server-migrate:
    logging: *local-logging
    image: ${YAPPER_SERVER_IMAGE:-yapper-server:0.1.0-dev}
    build: { context: ., target: server }
    environment: *server-environment
    command: [migrate]
    depends_on:
      postgres: { condition: service_healthy }
  server:
    logging: *local-logging
    image: ${YAPPER_SERVER_IMAGE:-yapper-server:0.1.0-dev}
    build: { context: ., target: server }
    restart: unless-stopped
    environment: *server-environment
    depends_on:
      server-migrate: { condition: service_completed_successfully }
      auth: { condition: service_healthy }
      livekit: { condition: service_started }
  livekit:
    logging: *local-logging
    image: livekit/livekit-server:v1.13.11@sha256:25cd902de7cacbd5f1f779f6a6ac1eae20ba8f56b0935934ce6b0ab80d1e3d20
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses: [0.0.0.0]
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
          node_ip: ${YAPPER_PUBLIC_IP:?Required}
        keys:
          ${LIVEKIT_API_KEY:?Required}: ${LIVEKIT_API_SECRET:?Required}
        room:
          auto_create: true
        logging:
          level: warn
          json: true
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"
  ingress:
    logging: *local-logging
    image: ${YAPPER_INGRESS_IMAGE:-yapper-ingress:0.1.0-dev}
    build: { context: ., target: ingress }
    restart: unless-stopped
    environment:
      YAPPER_DOMAIN: ${YAPPER_DOMAIN:?Required}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server: { condition: service_started }
volumes:
  postgres-data:
  caddy-data:
  caddy-config:
