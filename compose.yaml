name: yapper
services:
  database:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: yapper
      POSTGRES_USER: yapper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U yapper -d yapper]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-localkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_INTERNAL_URL: http://media:7880
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-ws://127.0.0.1:17880}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-}
      ALLOW_SCREEN_SHARE: ${ALLOW_SCREEN_SHARE:-true}
      FILES_DIR: /data/files
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-16777216}
      FILE_QUOTA_BYTES: ${FILE_QUOTA_BYTES:-1073741824}
      HTTP_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://yapper:${POSTGRES_PASSWORD}@database:5432/yapper?sslmode=disable
    volumes:
      - files:/data/files
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health/ready]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '127.0.0.1:${WEB_PORT:-18088}:8080'
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
  media:
    image: livekit/livekit-server:v1.13.7
    profiles: [media]
    command: [--config, /etc/livekit.yaml]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-localkey}: ${LIVEKIT_API_SECRET:-}"
    volumes:
      - ./deploy/livekit.local.yaml:/etc/livekit.yaml:ro
    ports:
      - '127.0.0.1:17880:7880'
      - '127.0.0.1:17881:17881'
      - '127.0.0.1:17882:17882/udp'
    restart: unless-stopped
volumes:
  database:
  files:
