global
  log stdout format raw local0
  maxconn 2048

defaults
  mode tcp
  log global
  timeout connect 5s
  timeout client 1h
  timeout server 1h

resolvers docker
  nameserver docker 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 10s

frontend tls
  bind :8443
  tcp-request inspect-delay 5s
  tcp-request content accept if { req.ssl_hello_type 1 }
  use_backend turn if { req.ssl_sni -i "${YAPPER_TURN_DOMAIN}" }
  default_backend https

backend https
  server ingress ingress:443 resolvers docker init-addr libc,none

backend turn
  server livekit livekit-turn:443 send-proxy-v2 resolvers docker init-addr libc,none
