name: Desktop
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install -g pnpm@12.6.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @yapper/web build
      - run: pnpm --filter @yapper/desktop build
      - if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter @yapper/desktop exec electron . --smoke --no-sandbox
      - if: runner.os == 'Windows'
        run: pnpm --filter @yapper/desktop smoke
      - run: pnpm --filter @yapper/desktop dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
