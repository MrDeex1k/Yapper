name: yapper-rebuild
services:
  postgres:
    image: postgres:18.3-alpine@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env first}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Generate .env first}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Generate .env first}
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/init-databases.sh:/docker-entrypoint-initdb.d/10-yapper.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
