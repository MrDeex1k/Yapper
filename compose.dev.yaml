name: yapper-rebuild
services:
  postgres:
    image: postgres:18.3-alpine@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env first}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Generate .env first}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Generate .env first}
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/init-databases.sh:/docker-entrypoint-initdb.d/10-yapper.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20
  livekit:
    image: livekit/livekit-server:v1.13.7@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses: [0.0.0.0]
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
          node_ip: 127.0.0.1
        keys:
          ${LIVEKIT_API_KEY:?Generate .env first}: ${LIVEKIT_API_SECRET:?Generate .env first}
        room:
          auto_create: true
          empty_timeout: 60
        logging:
          level: warn
          json: true
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"
volumes:
  postgres-data:
