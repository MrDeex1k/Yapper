name: yapper-rebuild
services:
  postgres:
    image: postgres:19.0-alpine@sha256:8b0ff4cdf221f0c53d7fcda681d3b461be725c492cd881c5ec9c0ad25023f188
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env first}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Generate .env first}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Generate .env first}
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/init-databases.sh:/docker-entrypoint-initdb.d/10-yapper.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20
  livekit:
    image: livekit/livekit-server:v1.13.11@sha256:25cd902de7cacbd5f1f779f6a6ac1eae20ba8f56b0935934ce6b0ab80d1e3d20
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses: [0.0.0.0]
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
          node_ip: 127.0.0.1
        keys:
          ${LIVEKIT_API_KEY:?Generate .env first}: ${LIVEKIT_API_SECRET:?Generate .env first}
        room:
          auto_create: true
          empty_timeout: 60
        logging:
          level: warn
          json: true
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"
volumes:
  postgres-data:
