[package]
name = "yapper-terminal"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[dependencies]
async-trait = "0.1"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
keyring = "=4.2.0"
livekit = "=0.12.0"
livekit-net = { version = "=0.2.0", features = ["native"] }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
unicode-width = "0.2"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
yapper-voice-policy = { path = "../../crates/voice-policy" }

[lints.rust]
unsafe_code = "forbid"
