[package]
name = "yapper-gpui"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
async-trait = "=0.1.89"
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
gpui = "=0.2.2"
gpui-component = "=0.5.1"
keyring = "=4.2.0"
livekit = "=0.12.0"
livekit-net = { version = "=0.2.0", features = ["native"] }
reqwest = { version = "=0.12.28", default-features = false, features = [
  "json",
  "rustls-tls-native-roots",
] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
# Enable WSS with native trust roots in LiveKit's WebSocket transport.
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = [
  "rustls-tls-native-roots",
] }
url = "=2.5.8"
uuid = { version = "=1.29.3", features = ["v4"] }
yapper-voice-policy = { path = "../../crates/voice-policy" }
